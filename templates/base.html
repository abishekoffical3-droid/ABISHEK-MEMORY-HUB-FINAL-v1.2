<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ site_title }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}">
</head>
<body>
<div class="ambient"><span></span><span></span><span></span></div>
<nav class="nav">
<a class="brand" href="{{ url_for('home') }}"><b>AB</b><span>ABISHEK<br><small>MEMORY HUB</small></span></a>
<div class="navlinks">
<a href="{{ url_for('home') }}">Home</a><a href="{{ url_for('library',kind='photo') }}">Photos</a><a href="{{ url_for('library',kind='video') }}">Videos</a>
<a href="{{ url_for('library',kind='story') }}">Stories</a><a href="{{ url_for('albums') }}">Albums</a><a href="{{ url_for('about') }}">About</a>
</div>
<a class="navbtn" href="{{ url_for('private') }}">Private</a>
</nav>
{% with msgs=get_flashed_messages() %}{% if msgs %}<div class="flash">{{ msgs[-1] }}</div>{% endif %}{% endwith %}
<main>{% block content %}{% endblock %}</main>
<footer><div><strong>ABISHEK MEMORY HUB</strong><p>{{ tagline }}</p></div><div>Developed by <strong>ABISHEK BHUSAL</strong><br>AB DEV STUDIO</div></footer>
<script src="{{ url_for('static',filename='main.js') }}"></script>
</body></html>
