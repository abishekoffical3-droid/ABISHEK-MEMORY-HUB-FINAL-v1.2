{% extends "base.html" %}{% block content %}<section class="pagehead reveal"><span class="eyebrow">CURATED COLLECTIONS</span><h1>Your albums.</h1><p>Group memories by people, places, seasons or feelings.</p></section><section class="section"><div class="album-grid">{% for a in albums %}<a class="album big reveal" href="{{ url_for('album',album_id=a.id) }}"><span>◌</span><h2>{{ a.name }}</h2><p>{{ a.description }}</p><small>{{ a.count }} memories</small></a>{% else %}<div class="empty">No albums yet.</div>{% endfor %}</div></section>{% endblock %}
